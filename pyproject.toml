# Shared ruff settings for all Python in the repo (api/, pipeline/, db/, scripts/), and the
# API's dependencies for Vercel (D131), whose Python service is rooted here.
# Ruff runs from its official Docker image via `make lint`.

# For Vercel only: it installs a service's dependencies with uv from the pyproject.toml at
# the service's root (here), and reads the Python version from requires-python. The list
# is api/requirements.txt's, which Docker uses (it can't see this folder);
# api/tests/test_vercel_config.py keeps the two the same. Reasons for each: DECISIONS.md.
[project]
name = "tali-fitness-api"
version = "0.0.0"
requires-python = "==3.13.*"  # the Airflow image's Python, as in api/Dockerfile
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "Authlib==1.9.4",
    "httpx2==2.16.0",
    "itsdangerous==2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors and pyflakes; I: import order; B: likely bugs; UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Ruff runs from the repo root, so tell it which top-level packages are ours.
known-first-party = ["app", "include"]

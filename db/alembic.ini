# Alembic config for the warehouse database ("app").
# Run inside the api container: alembic -c /db/alembic.ini upgrade head  (or `make migrate`)
# The database URL comes from WAREHOUSE_URL; see migrations/env.py.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

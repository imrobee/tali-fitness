name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CI needs no real secrets: the example values are enough to run the stack.
      - name: Create .env from the example
        run: cp .env.example .env

      # Same command as local: lint, typecheck, and tests against real Postgres.
      # -k (keep going): run every step even after one fails, so a single CI run reports
      # all failures; the job still fails if any step failed.
      - name: make check
        run: make -k check

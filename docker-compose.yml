# Local development stack (ARCHITECTURE.md section 2). Start with `make up`.
# Values like ${POSTGRES_USER} come from .env.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app # the warehouse; db/init creates the "airflow" database too
    ports:
      # Mac port 5433 (5432 is taken by a local Postgres); containers still use 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d app"]
      interval: 5s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      # Sync now asks Airflow to run strava_sync; the login comes from .env.
      AIRFLOW_URL: http://airflow:8080
      # Where the launch screen's Demo button goes: the demo stack below.
      DEMO_PUBLIC_URL: ${DEMO_PUBLIC_URL:-http://localhost:5174}
      PYTHONPATH: /app:/opt/airflow # app (the API) and include (the pipeline, mounted below)
    # --factory: Uvicorn calls create_app(), which runs the startup guards first.
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "0.0.0.0:8000:8000" # all interfaces, so the iPhone can reach it on the LAN
    volumes:
      - ./api:/app
      - ./db:/db # Alembic migrations and SQL files
      - ./docs/samples:/samples:ro # recorded payloads used as test fixtures
      - ./scripts:/scripts:ro # make_ingest_token.py, tested here
      # The pipeline's code and SQL at their Airflow paths: the demo seed tests replay
      # synthetic data through it (app/demo/replay.py, DECISIONS D119).
      - ./pipeline/include:/opt/airflow/include:ro
      - ./db:/opt/airflow/db:ro
      # For test_tour_claims.py: the tour's and How it works' words, and what they claim
      # about the DAG schedules and the reseed workflow's cron.
      - ./web/src/tour:/tour:ro
      - ./web/src/pages/howItWorks.json:/pages/howItWorks.json:ro
      - ./pipeline/dags:/opt/airflow/dags:ro
      - ./.github/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 10

  airflow:
    build: ./pipeline
    env_file: .env
    command: ["bash", "/opt/airflow/start_airflow.sh"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      PYTHONDONTWRITEBYTECODE: "1" # no __pycache__ in the bind-mounted dags/ folder
      PYTHONPATH: /opt/airflow # lets DAGs and tests `import include...`
    ports:
      - "127.0.0.1:8080:8080" # Airflow UI, this Mac only
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/include:/opt/airflow/include
      - ./pipeline/tests:/opt/airflow/tests
      - ./db:/opt/airflow/db:ro # SQL files (db/sql) and migrations for the tests
      - ./docs/samples:/opt/airflow/samples:ro # recorded API samples used as test fixtures
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 15s
      start_period: 120s
      retries: 10

  web:
    build: ./web
    ports:
      - "0.0.0.0:5173:5173" # all interfaces, so the iPhone can reach it on the LAN
    volumes:
      - ./web:/app
      - /app/node_modules # keep the image's node_modules; don't use the host's
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 10

  # --- Demo stack (profile "demo": `make up` never starts these) ----------------------------
  # The public demo, run locally, and the screenshots (DECISIONS D118). Its own database
  # (app_demo) and two roles that cannot open the real one; the API gets only the
  # read-only role and no .env, so it holds none of the real app's secrets.

  # One-off: builds app_demo and loads a scenario. The only demo piece with an admin URL,
  # and it never serves anything; on a host this step is done by hand (ARCHITECTURE 13).
  demo-seed:
    profiles: ["demo"]
    build: ./api
    environment:
      PYTHONPATH: /app:/opt/airflow
      # Real time, like the hosted demo. Only `make screenshots` freezes it (D124).
      NOW_OVERRIDE: ${DEMO_NOW_OVERRIDE:-}
      DEMO_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DEMO_SEED_URL: postgresql+psycopg://demo_seed:${DEMO_SEED_PASSWORD:-localdemoseed}@postgres:5432/app_demo
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-localdemoreader}
      DEMO_LOCK_DATABASES: app,airflow
    command: ["python", "/scripts/seed_demo.py"]
    volumes:
      - ./api:/app
      - ./db:/db
      - ./scripts:/scripts:ro
      # The real pipeline code, at the paths it has in the Airflow image (D119).
      - ./pipeline/include:/opt/airflow/include:ro
      - ./db:/opt/airflow/db:ro
    depends_on:
      postgres:
        condition: service_healthy

  api-demo:
    profiles: ["demo"]
    build: ./api
    # No env_file: the demo must start without a single real secret (the startup guard
    # refuses GOOGLE_*, STRAVA_*, INGEST_TOKEN*, AIRFLOW_*, POSTGRES_* and the dev key).
    environment:
      APP_ENV: demo
      AUTH_MODE: demo
      APP_TIMEZONE: Asia/Manila
      WAREHOUSE_URL: postgresql+psycopg://demo_reader:${DEMO_READER_PASSWORD:-localdemoreader}@postgres:5432/app_demo
      # Signs demo visitors' cookies on this Mac only; the guard refuses it over HTTPS.
      DEMO_SESSION_SECRET: local-demo-session-secret-only-for-this-mac-0001
      PUBLIC_BASE_URL: http://localhost:5174
      # The real app, whose launch screen the Me page's "Return to login screen" opens.
      MAIN_APP_URL: ${MAIN_APP_URL:-http://localhost:5173}
      # Real time, like the hosted demo. Only `make screenshots` freezes it (D124).
      NOW_OVERRIDE: ${DEMO_NOW_OVERRIDE:-}
    # Serves only. The demo is rebuilt elsewhere (demo-seed here; a scheduled GitHub
    # Actions job when hosted, DECISIONS D121), so this service holds demo_reader alone.
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    volumes:
      - ./api:/app
      - ./db:/db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      retries: 20

  web-demo:
    profiles: ["demo"]
    build: ./web
    environment:
      API_PROXY_TARGET: http://api-demo:8000
    ports:
      - "127.0.0.1:5174:5173" # the demo app on this Mac, for checking screenshots by eye
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api-demo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 20

  screenshots:
    profiles: ["demo"]
    build:
      context: ./web
      dockerfile: Dockerfile.playwright
    environment:
      BASE_URL: http://web-demo:5173
    volumes:
      - ./web/e2e:/app/e2e:ro
      - ./web/src/tour:/app/tour:ro # the tour's steps, for e2e/tour.spec.ts
      - ./web/playwright.config.ts:/app/playwright.config.ts:ro
      - ./docs/screenshots:/app/screenshots

volumes:
  pgdata:
